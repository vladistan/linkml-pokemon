        required: false
      quantityValue:
        name: quantityValue
        range: QuantityValue
      isDeltaQuantity:
        name: isDeltaQuantity
        range: boolean
    class_uri: qudt:Quantity
  Quantifiable:
    name: Quantifiable
    description: <p><em>Quantifiable</em> ascribes to some thing the capability of
      being measured, observed, or counted.</p>
    comments:
    - <p><em>Quantifiable</em> ascribes to some thing the capability of being measured,
