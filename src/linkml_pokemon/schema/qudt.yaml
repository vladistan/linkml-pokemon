  CardinalityType:
    name: CardinalityType
    description: "\n  In mathematics, the cardinality of a set is a measure of the\
      \ number of elements of the set.\n  For example, the set $A = {2, 4, 6}$ contains\
      \ 3 elements, and therefore $A$ has a cardinality of 3.\n  There are two approaches\
      \ to cardinality: one which compares sets directly using bijections and injections,\n\
      \   and another which uses cardinal numbers.\n  "
