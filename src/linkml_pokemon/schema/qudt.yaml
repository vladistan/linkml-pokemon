  QuantityValue:
    name: QuantityValue
    description: A <i>Quantity Value</i> expresses the magnitude and kind of a quantity
      and is given by the product of a numerical value <code>n</code> and a unit of
      measure <code>U</code>. The number multiplying the unit is referred to as the
      numerical value of the quantity expressed in that unit. Refer to <a href="http://physics.nist.gov/Pubs/SP811/sec07.html">NIST
      SP 811 section 7</a> for more on quantity values.
    comments:
    - A <i>Quantity Value</i> expresses the magnitude and kind of a quantity and is
      given by the product of a numerical value <code>n</code> and a unit of measure
      <code>U</code>. The number multiplying the unit is referred to as the numerical
      value of the quantity expressed in that unit. Refer to <a href=\"http://physics.nist.gov/Pubs/SP811/sec07.html\">NIST
      SP 811 section 7</a> for more on quantity values.^^rdf:HTML
    from_schema: http://qudt.org/3.1.6/schema/qudt
    is_a: Quantifiable
    mixins:
    - Concept
    slot_usage:
      hasUnit:
        name: hasUnit
        multivalued: false
    class_uri: qudt:QuantityValue
