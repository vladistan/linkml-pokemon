---
id: http://xmlns.com/foaf/0.1/
name: foaf
title: FOAF Vocabulary
description: FOAF Vocabulary
license: MIT

prefixes:
  foaf: http://xmlns.com/foaf/0.1/

imports:
  - ./owl

classes:
  Person:
    is_a: NamedIndividual
    description: A person is a human being
    class_uri: foaf:Person
    slots:
      - depiction

  Artwork:
    is_a: NamedIndividual
    class_uri: foaf:Image
    description: >-
      A visual representation or artwork depicting an entity. In the Pokémon context,
      this includes official artwork, sprites, and other visual media.
    slots:
      - depicts

slots:
  depiction:
    range: Artwork
    multivalued: true
    slot_uri: foaf:depiction
    inverse: depicts
    inlined_as_list: true
    description: Visual artwork depicting this entity

  depicts:
    range: NamedIndividual
    slot_uri: foaf:depicts
    multivalued: true
    inlined_as_list: true
    inverse: depiction
    description: The entity depicted in this artwork
