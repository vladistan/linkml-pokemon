  hasBaseUnit:
    name: hasBaseUnit
    description: This property relates a system of units to a base unit defined within
      the system. The base units of a system are used to define the derived units
      of the system by expressing the derived units as products of the base units
      raised to a rational power.
    from_schema: http://qudt.org/3.1.6/schema/qudt
    is_a: hasCoherentUnit
    slot_uri: qudt:hasBaseUnit
    multivalued: true
  hasDerivedUnit:
    name: hasDerivedUnit
    description: This property relates a system of units to a unit of measure that
      is defined within the system in terms of the base units for the system. That
      is, the derived unit is defined as a product of the base units for the system
      raised to some rational power.
    from_schema: http://qudt.org/3.1.6/schema/qudt
    slot_uri: qudt:hasDerivedUnit
    multivalued: true
  hasUnit:
    name: hasUnit
    description: This property relates a factor unit to its unit or a system of units
      with a unit of measure that is either a) defined by the system, or b) accepted
      for use by the system and is convertible to a unit of equivalent dimension that
      is defined by the system. Systems of units may distinguish between base and
      derived units. Base units are the units which measure the base quantities for
      the corresponding system of quantities. The base units are used to define units
      for all other quantities as products of powers of the base units. Such units
      are called derived units for the system.
