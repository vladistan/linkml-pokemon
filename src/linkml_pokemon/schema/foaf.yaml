---
id: http://xmlns.com/foaf/0.1/
name: foaf
title: FOAF Vocabulary
description: FOAF Vocabulary
license: MIT

prefixes:
  foaf: http://xmlns.com/foaf/0.1/

imports:
  - ./owl

classes:
  Person:
    is_a: NamedIndividual
    description: A person is a human being
    class_uri: foaf:Person
    slots:
      - depiction

slots:
  depiction:
    range: string
    multivalued:
    slot_uri: foaf:depiction
    description: A depiction of the person
