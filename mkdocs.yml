---
site_name: Pokemon LinkML Model
site_description: LinkML model for Pokemon Ontology
site_author: Vlad Korolev
site_url: https://vladistan.github.io/linkml-pokemon/
repo_url: https://github.com/vladistan/linkml-pokemon
repo_name: vladistan/linkml-pokemon

theme:
  name: material
  toc_depth: 3
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy

plugins:
  - search
  - mermaid2

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/open-diagrams.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Data Dictionary: datadict.md
  - Data Patches: DATA_PATCHES.md
  - About: about.md

extra:
  analytics:
    provider: google
    property: G-4KG00QCXJD
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vladistan/linkml-pokemon
    - icon: fontawesome/solid/globe
      link: https://pokemonkg.org

copyright: Copyright &copy; 2025 Vlad Korolev
