---
id: https://dbpedia.org/ontology/
name: dbpedia
title: DBpedia Ontology
description: DBpedia Ontology subset for Pokemon Knowledge Graph
license: CC-BY-SA-3.0

prefixes:
  dbpedia: http://dbpedia.org/ontology/
  dbr: http://dbpedia.org/resource/

imports:
  - ./owl

classes:
  Colour:
    is_a: Thing
    description: >-
      Color or colour is the visual perceptual property corresponding in humans
      to the categories called red, yellow, blue and others.
    class_uri: dbpedia:Colour
    slots:
      # CMYK coordinates
      - cyanic
      - magenta
      - colourYellow
      - black
      # Physical properties
      - wavelength
      - frequency
      # Display properties
      - colourHexCode
      # Relationships
      - connotation
      - thumbnail

  Connotation:
    is_a: Thing
    class_uri: owl:Thing
    description: >-
      Cultural or symbolic meaning associated with a colour.
      Imported from DBpedia as generic owl:Thing resources.
    slot_usage:
      name:
        required: true

slots:
  # CMYK color coordinates (0-100)
  cyanic:
    range: integer
    slot_uri: dbpedia:cmykCoordinateCyanic
    description: Cyan component in CMYK color model (0-100)

  magenta:
    range: integer
    slot_uri: dbpedia:cmykCoordinateMagenta
    description: Magenta component in CMYK color model (0-100)

  colourYellow:
    range: integer
    slot_uri: dbpedia:cmykCoordinateYellow
    description: Yellow component in CMYK color model (0-100)

  black:
    range: integer
    slot_uri: dbpedia:cmykCoordinateBlack
    description: Black (K) component in CMYK color model (0-100)

  # Physical properties
  wavelength:
    range: float
    slot_uri: dbpedia:wavelength
    description: The wavelength of the color in meters (e.g., 4.5e-07 for blue)

  frequency:
    range: float
    slot_uri: dbpedia:frequency
    description: The frequency of the color in Hz

  # Display properties
  colourHexCode:
    range: string
    slot_uri: dbpedia:colourHexCode
    description: Hexadecimal RGB color code (e.g., "0000FF" for blue)

  # Relationships
  connotation:
    range: Connotation
    slot_uri: dbpedia:connotation
    multivalued: true
    inlined: false
    description: Cultural or symbolic meanings associated with this colour

  thumbnail:
    range: uri
    slot_uri: dbpedia:thumbnail
    description: URL to a representative image of this colour
