classes:
  Ability:
    name: Ability
    definition_uri: https://pokemonkg.org/ontology#Ability
    annotations:
      rdfs:comment:
        tag: rdfs:comment
        value: Abilities were introduced in Generation III as an all new game mechanic.
          Each and every Pokemon has an ability, and can only have one at a time.
          Some abilities are exclusive to certain Pokemon and Evolution lines, while
          others are known by many Pokemon.
    from_schema: https://pokemonkg.org/ontology
    mappings:
    - pokemon:Ability
    is_a: Thing
    slots:
    - id
    - name
    - description
    - effectDescription
    class_uri: pokemon:Ability
  BattleItem:
    name: BattleItem
    definition_uri: https://pokemonkg.org/ontology#BattleItem
    description: Battle items are items that can be used during battles.
    from_schema: https://pokemonkg.org/ontology
    is_a: Item
    slots:
    - id
    - name
    - description
    class_uri: pokemon:BattleItem
  Berry:
    name: Berry
    definition_uri: https://pokemonkg.org/ontology#Berry
    annotations:
      rdfs:comment:
        tag: rdfs:comment
        value: "Berries are small, juicy, fleshy fruit. As in the real world, a large\
          \ variety exists in the Pok\xE9mon world, with a large range of flavors,\
          \ names, and effects. First found in the Generation II games, many Berries\
          \ have since became critical help items in battle, where their various effects\
          \ include HP and status condition restoration, stat enhancement, and even\
          \ damage negation."
    from_schema: https://pokemonkg.org/ontology
    is_a: Food
    slots:
    - id
    - name
    - description
    - hasFlavor
    - firmness
    - smoothness
    - hasSize
    class_uri: pokemon:Berry
  EggGroup:
    name: EggGroup
    definition_uri: https://pokemonkg.org/ontology#EggGroup
    annotations:
      rdfs:comment:
        tag: rdfs:comment
        value: "Egg group is a category that determines which Pokemon are able to\
          \ interbreed. The concept was introduced in Generation II, along with breeding.\
          \ Similar to types, a Pok\xE9mon may belong to either one or two egg groups."
    from_schema: https://pokemonkg.org/ontology
    is_a: NamedIndividual
    slots:
    - id
    - description
    - NamedIndividual_name
    class_uri: pokemon:EggGroup
  Flavor:
    name: Flavor
    definition_uri: https://pokemonkg.org/ontology#Flavor
    annotations:
      rdfs:comment:
        tag: rdfs:comment
        value: "Flavor is a special set of attributes that certain foods in the Pok\xE9\
          mon world have. Most of the foods can have more than one flavor, and the\
          \ flavor determines which Pokemon can eat them."
    from_schema: https://pokemonkg.org/ontology
    is_a: NamedIndividual
    slots:
    - id
    - description
    - NamedIndividual_name
    class_uri: pokemon:Flavor
  Food:
    name: Food
    definition_uri: https://pokemonkg.org/ontology#Food
    from_schema: https://pokemonkg.org/ontology
    is_a: Item
    slots:
    - id
    - name
    - description
    - hasFlavor
    - firmness
    - smoothness
    class_uri: pokemon:Food
  Game:
    name: Game
    definition_uri: https://pokemonkg.org/ontology#Game
    description: A game is a type of media that can be played by people.
    from_schema: https://pokemonkg.org/ontology
    is_a: Thing
    slots:
    - id
    - name
    - description
    class_uri: pokemon:Game
  Generation:
    name: Generation
    definition_uri: https://pokemonkg.org/ontology#Generation
    annotations:
      rdfs:comment:
        tag: rdfs:comment
        value: Generations refers to the Pokemon game series. It is a group of games
          that were released at or around the same time. It also means that games
          in the same generation are compatible with the others, containing the same
          Pokemon and the number of moves there are to be learned.
    from_schema: https://pokemonkg.org/ontology
    is_a: Thing
    slots:
    - id
    - name
    - description
    - featuresSpecies
    class_uri: pokemon:Generation
  Gym:
    name: Gym
    definition_uri: https://pokemonkg.org/ontology#Gym
    description: A gym is a location that can be battled at.
    from_schema: https://pokemonkg.org/ontology
    is_a: Place
    slots:
    - id
    - name
    - description
    class_uri: pokemon:Gym
  GymLeader:
    name: GymLeader
    definition_uri: https://pokemonkg.org/ontology#GymLeader
    annotations:
      rdfs:comment:
        tag: rdfs:comment
        value: "A gym leader is the highest ranking member and owner of an official\
          \ Pok\xE9mon gym. Gym leaders use their gym and their Pokemon to test the\
          \ skills of trainers that challenge them, and if said trainers win a battle,\
          \ the gym leader will gift them a badge that's unique to that specific gym."
    from_schema: https://pokemonkg.org/ontology
    is_a: Trainer
    slots:
    - id
    - description
    - NamedIndividual_name
    - depiction
    class_uri: pokemon:GymLeader
