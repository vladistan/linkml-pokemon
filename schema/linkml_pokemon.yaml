    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  HabitatEnum:
    name: HabitatEnum
    definition_uri: https://pokemonkg.org/ontology#HabitatEnum
    implements:
    - owl:NamedIndividual
    from_schema: https://pokemonkg.org/ontology
    permissible_values:
      Cave:
        text: Cave
        meaning: pokemon:Habitat_Cave
      Forest:
        text: Forest
        meaning: pokemon:Habitat_Forest
      Grassland:
        text: Grassland
        meaning: pokemon:Habitat_Grassland
