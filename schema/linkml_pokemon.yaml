    class_uri: pokemon:HoldItem
  Item:
    name: Item
    definition_uri: https://pokemonkg.org/ontology#Item
    annotations:
      rdfs:comment:
        tag: rdfs:comment
        value: "An item is an object in the Pok\xE9mon games which the player can\
          \ pick up, keep in their Bag, and use in some manner. They have various\
          \ uses, including healing, powering up, helping one to catch Pok\xE9mon,\
