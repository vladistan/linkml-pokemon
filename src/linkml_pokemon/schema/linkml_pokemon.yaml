---
id: https://pokemonkg.org/ontology
name: linkml-pokemon
title: Pokémon Ontology
description: |-
  Ontology covering the Pokémon world as it is presented in games and anime television series
license: MIT
see_also:
  - https://vladistan.github.io/linkml-pokemon
created_on: 2019-07-27 00:00:00
annotations:
  dcterms:description: Ontology covering the Pokémon world as it is presented in games and anime television series.
  dcterms:issued: 2019-07-27^^xsd:date

prefixes:
  linkml_pokemon: https://w3id.org/vladistan/linkml-pokemon/
  linkml: https://w3id.org/linkml/
  linkml_common: https://w3id.org/linkml/common/
  schema: http://schema.org/
  PATO: http://purl.obolibrary.org/obo/PATO_
  example: https://example.org/
  owl: http://www.w3.org/2002/07/owl#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  xml: http://www.w3.org/XML/1998/namespace
  xsd: http://www.w3.org/2001/XMLSchema#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  foaf: http://xmlns.com/foaf/0.1/
  dbpedia: http://dbpedia.org/ontology/
  pokemon: https://pokemonkg.org/ontology#
  qudt: http://qudt.org/schema/qudt/

default_prefix: pokemon
default_range: string

imports:
  - linkml:types
  - ./foaf
  - ./dbpedia
  - ./owl
  - ./qudt

classes:

  Ability:
    description: >-
      Abilities were introduced in Generation III as an all new game mechanic. Each and every Pokémon
      has an ability, and can only have one at a time. Some abilities are exclusive to certain Pokémon
      and Evolution lines, while others are known by many Pokémon.
    class_uri: pokemon:Ability
    is_a: Thing
    slots:
      - effectDescription

  BattleItem:
    description: >-
      Battle items are items that can be used during battles.
    is_a: Item

  Berry:
    description: >-
      Berries are small, juicy, fleshy fruit. As in the real world, a large variety exists in the
      Pokémon world, with a large range of flavors, names, and effects. First found in the Generation
      II games, many Berries have since became critical help items in battle, where their various
      effects include HP and status condition restoration, stat enhancement, and even damage negation.
    slots:
      - hasSize
    is_a: Food

  EggGroup:
    description: >-
      Egg group is a category that determines which Pokémon are able to interbreed. The concept was
      introduced in Generation II, along with breeding. Similar to types, a Pokémon may belong to
      either one or two egg groups.
    is_a: NamedIndividual

  Flavor:
    description: >-
      Flavor is a special set of attributes that certain foods in the Pokémon world have. Most of
      the foods can have more than one flavor, and the flavor determines which Pokémon can eat them.
    is_a: NamedIndividual

  Food:
    description: >-
      Food items are consumable items in the Pokémon world that can have flavors, firmness, and
      smoothness attributes.
    slots:
      - hasFlavor
      - firmness
      - smoothness
    is_a: Item

  Game:
    description: >-
      A game is a type of media that can be played by people.
    is_a: Thing


  Generation:
    description: >-
      Generations refers to the Pokémon game series. It is a group of games that were released at or
      around the same time. It also means that games in the same generation are compatible with the
      others, containing the same Pokémon and the number of moves there are to be learned.
    slots:
      - featuresSpecies
    is_a: Thing

  Gym:
    is_a: Place
    description: >-
      A gym is a location that can be battled at.

  GymLeader:
    is_a: Trainer
    description: >-
      A gym leader is the highest ranking member and owner of an official Pokémon gym. Gym leaders
      use their gym and their Pokémon to test the skills of trainers that challenge them, and if said
      trainers win a battle, the gym leader will gift them a badge that's unique to that specific gym.

  HM:
    is_a: Item
    description: >-
      Hidden Machine

  Habitat:
    description: >-
      A habitat is a type of environment that certain Pokémon belong to.
    is_a: NamedIndividual

  HoldItem:
    is_a: Item
    description: >-
      A hold item is an item that can be held by a Pokémon.

  Item:
    description: >-
      An item is an object in the Pokémon games which the player can pick up, keep in their Bag, and
      use in some manner. They have various uses, including healing, powering up, helping one to catch
      Pokémon, or to access a new area.
    is_a: Thing

  Pokedex:
    class_uri: "https://pokemonkg.org/ontology#Pok%C3%A9dex"
    description: >-
      The Pokédex is an electronic device designed to catalog and provide information regarding the
      various species of Pokémon featured in the Pokémon video game, anime and manga series.
    is_a: Thing

  Pokemon:
    class_uri: "https://pokemonkg.org/ontology#Pok%C3%A9mon"
    description: A Pokémon
    annotations:
      rdfs:seeAlso: "<https://dbpedia.org/resource/Pokémon>"
    union_of:
      - Pokedex
      - Type

  PokedexEntry:
    class_uri: "https://pokemonkg.org/ontology#Pok%C3%A9dexEntry"
    description: >-
      A Pokédex entry is a description of a Pokémon.
    is_a: Thing

  Pokeball:
    class_uri: "https://pokemonkg.org/ontology#Pok%C3%A9ball"
    is_a: Item
    description: >-
      A Poké Ball is a type of item that is critical to a Trainer's quest, used for catching and
      storing Pokémon.

  Place:
    is_a: Thing
    abstract: true
    description: >-
      Entities that have a somewhat fixed, physical extension.

  Shape:
    description: >-
      Shapes are categories that certain Pokémon belong to,
      which determine which Pokémon they can breed with.
    is_a: NamedIndividual

  Region:
    is_a: Place
    description: >-
      Regions are areas in the Pokémon universe that are smaller parts of a nation.

  Species:
    is_a: NamedIndividual
    class_uri: pokemon:Species
    description: >-
      A species is a category of Pokémon that share common features.
    slots:
      - hasColor
      - mayHaveHiddenAbility
      - mayHaveAbility
      - isAbleToApply
      - hasHeight
      - hasWeight
      - depiction
      - inEggGroup
      - hasType
      - hasShape
      - hasGenus
      - hasCatchRate
      - foundIn

  Move:
    description: >-
      A move is a special ability of a Pokémon.
    slots:
      - effectDescription
      - hasType
    class_uri: pokemon:Move
    is_a: Thing

  MoveLearning:
    description: >-
      A move learning is a way that a Pokémon can learn a move.

  LearningByLevelingUp:
    is_a: MoveLearning
    description: >-
      A move that is learned by leveling up.

  LearningThroughBreeding:
    is_a: MoveLearning
    description: >-
      A move that is learned by breeding.

  Medicine:
    is_a: Item
    description: >-
       Medicine items can heal various afflictions of a Pokémon.

  SpecialMove:
    is_a: Move
    description: >-
      A special move is a type of move that can be used during battles.

  PhysicalMove:
    is_a: Move
    description: >-
      A physical move is a type of move that can be used during battles.

  StatusMove:
    is_a: Move
    description: >-
      A status move is a type of move that can be used during battles.

  TM:
    is_a: Item
    mixins:
      - MoveLearning
    description: >-
      A Technical Machine is an item that can be used to teach a Pokémon a move.

  Town:
    is_a: Place
    description: >-
      A town is a type of place that can be visited.

  Trainer:
    is_a: Person
    description: >-
      A trainer is a person who is able to catch Pokémon.

  Type:
    description: >-
      All Pokémon creatures and their moves are assigned certain types. Each type has several
      strengths and weaknesses in both attack and defense.
    is_a: NamedIndividual
    class_uri: pokemon:Type

slots:

  effectDescription:
    range: string
    slot_uri: pokemon:effectDescription
    description: >-
      A description of the effect of the entity
    multivalued: true
    required: false

  containsPlace:
    slot_uri: pokemon:contains_place
    range: Place
    domain: Place
    transitive: true
    asymmetric: true
    inverse: locatedIn
    multivalued: true
    required: false
    description: >-
      A place is contained to some extent in this place.

  describedInPokedex:
    slot_uri: "https://pokemonkg.org/ontology#describedInPok%C3%A9dex"
    range: PokedexEntry
    domain: Species
    inverse: describesPokemon
    multivalued: true
    required: false
    description:
      - "A Pokédex entry is described in a Pokédex"

  describesPokemon:
    slot_uri: "https://pokemonkg.org/ontology#describesPok%C3%A9mon"
    range: Species
    domain: PokedexEntry
    multivalued: true
    required: false
    description: >-
      A Pokémon that is described by this Pokédex entry.

  featuresSpecies:
    slot_uri: pokemon:featuresSpecies
    range: Species
    multivalued: true
    required: false
    description:
      - "A Pokédex entry features a species"

  hasPokedexEntry:
    slot_uri: "https://pokemonkg.org/ontology#hasPok%C3%A9dexEntry"
    range: PokedexEntry
    domain: Pokedex
    multivalued: true
    required: false
    description: >-
      A Pokédex entry in which this Pokémon is described.

  evolvesFrom:
    slot_uri: pokemon:evolvesFrom
    range: Species
    domain: Species
    inverse: evolvesTo
    multivalued: false
    required: false
    description: >-
      This species evolves the other species.

  evolvesTo:
    slot_uri: pokemon:evolvesTo
    range: Species
    domain: Species
    multivalued: true
    required: false
    inverse: evolvesFrom
    description: >-
      A Pokémon evolves to another Pokémon.

  foundIn:
    slot_uri: pokemon:foundIn
    range: Habitat
    domain: Species
    multivalued: true
    required: false
    description: A place is found in a location

  hasColor:
    slot_uri: pokemon:hasColour
    range: Color
    inlined: false
    multivalued: false
    required: false
    description: A Pokémon has a color

  hasFlavor:
    slot_uri: pokemon:hasFlavor
    range: Flavor
    domain: Food
    multivalued: true
    required: false
    description: A Pokémon has a flavor

  hasType:
    slot_uri: pokemon:hasType
    range: Type
    multivalued: true
    required: false
    inlined_as_list: true
    description: A Pokémon has a type

  hasSize:
    slot_uri: pokemon:hasSize
    range: Quantity
    multivalued: false
    required: false
    inlined: true
    description: >-
      The physical size of an entity, expressed as a quantity with unit.

  hasHeight:
    slot_uri: pokemon:hasHeight
    domain: Species
    range: Quantity
    inlined: true
    multivalued: false
    required: false
    description: >-
      How tall a Pokémon species is, expressed as a quantity with unit.

  hasWeight:
    slot_uri: pokemon:hasWeight
    domain: Species
    range: Quantity
    inlined: true
    multivalued: false
    required: false
    description: >-
      How heavy a Pokémon species is, expressed as a quantity with unit.

  hasCatchRate:
    slot_uri: pokemon:hasCatchRate
    range: integer
    domain: Species
    multivalued: false
    required: false
    description: >-
      Determines how easy a Pokémon species is to catch, with higher values meaning easier capture.

  hasShape:
    slot_uri: pokemon:hasShape
    range: Shape
    domain: Species
    multivalued: false
    required: false
    description: >-
      The shape of a berry is a measure of how good it
      is for making a Potion.

  learnsMove:
    slot_uri: pokemon:learnsMove
    range: Move
    domain: MoveLearning
    multivalued: true
    required: false
    description: >-
      The move acquired through this particular learning method.

  locatedIn:
    description: >-
      This place is located to some extent in another place.
    slot_uri: pokemon:locatedIn
    range: Place
    domain: Place
    multivalued: true
    required: false
    asymmetric: true
    transitive: true

  inEggGroup:
    slot_uri: pokemon:inEggGroup
    range: EggGroup
    domain: Species
    multivalued: true
    required: false
    description: >-
      Which egg group a species belongs to, controlling which Pokémon can breed together.

  mayHaveAbility:
    slot_uri: pokemon:mayHaveAbility
    range: Ability
    domain: Species
    multivalued: true
    inlined_as_list: true
    description: A Pokémon may have an ability

  mayHaveHiddenAbility:
    slot_uri: pokemon:mayHaveHiddenAbility
    range: Ability
    domain: Species
    multivalued: true
    inlined_as_list: true
    subproperty_of: mayHaveAbility
    description: >-
      A special ability only obtainable through specific encounters or events, not through normal
      gameplay.

  isAbleToApply:
    slot_uri: pokemon:isAbleToApply
    range: Move
    multivalued: true
    required: false
    inlined_as_list: true
    description: >-
      Moves that a Pokémon can use in battle or in the overworld.

  firmness:
    range: integer
    domain: Food
    description: >-
      How firm a berry or food item feels, affecting its use in Pokéblock or Poffin making.

  accuracy:
    range: integer
    domain: Move
    description: >-
      Chance of a move successfully hitting the target, as a percentage.

  basePower:
    range: integer
    domain: Move
    description: >-
      Base damage output of a move before applying type effectiveness and stat modifiers.

  basePowerPoints:
    range: integer
    domain: Move
    description: >-
      Starting number of times a move can be used before needing restoration.

  entryNumber:
    range: integer
    domain: PokedexEntry
    description: >-
      The unique number identifying this entry within a Pokédex.

  hasGenus:
    range: string
    domain: Species
    description: >-
      The species category label shown in the Pokédex, such as "Seed Pokémon" for Bulbasaur.

  maxPowerPoints:
    range: integer
    domain: Move
    description: >-
      Maximum times a move can be used after PP-enhancing items are applied.

  minLevelToLearn:
    range: integer
    description: >-
      The minimum level a Pokémon needs to reach to learn this move.

  smoothness:
    range: integer
    domain: Food
    description: >-
      How smooth a berry or food item is, affecting its use in Pokéblock or Poffin making.

enums:

  HabitatEnum:
    implements:
      - owl:NamedIndividual
    permissible_values:
      Cave:
        meaning: pokemon:Habitat_Cave
        description: >-
          A hollow underground area, typically formed in rocky or mountainous terrain.
      Forest:
        meaning: pokemon:Habitat_Forest
        description: >-
          A dense area covered with trees and undergrowth.
      Grassland:
        meaning: pokemon:Habitat_Grassland
        description: >-
          An open area of land covered predominantly with grasses and low vegetation.
      Mountain:
        meaning: pokemon:Habitat_Mountain
        description: >-
          A large elevated landform rising steeply above the surrounding terrain.
      Rare:
        meaning: pokemon:Habitat_Rare
        description: >-
          An uncommon or hard-to-reach environment with no single fixed location.
      Rough terrain:
        meaning: pokemon:Habitat_RoughTerrain
        description: >-
          Harsh, uneven landscape such as deserts, volcanic areas, or rocky wastelands.
      Sea:
        meaning: pokemon:Habitat_Sea
        description: >-
          Open deep water far from shore, including oceans and large lakes.
      Urban:
        meaning: pokemon:Habitat_Urban
        description: >-
          A densely developed area with buildings, roads, and other human-made structures.
      Water's edge:
        meaning: pokemon:Habitat_WatersEdge
        description: >-
          The transitional zone where land meets water, including shorelines, riverbanks, and wetlands.
